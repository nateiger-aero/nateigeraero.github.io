<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thats Not My Future OS</title>
  
  <link id="os-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/7.css/dist/7.css">
  
  <style>
    :root {
      --custom-text-color: inherit;
      --custom-border-color: transparent;
      --custom-bg-tint: transparent;
      --icon-filter: none;
    }
    
    body { background-color: #0a0a0a; margin: 0; height: 100vh; display: flex; flex-direction: row; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    #monitor-station { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .monitor-bezel { width: 100%; max-width: 1000px; height: 80vh; position: relative; transition: all 0.5s ease; }
    .bezel-70s { background-color: #1a1a1a; padding: 40px; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
    .bezel-90s { background-color: #e0d8c8; padding: 30px 30px 40px 30px; border-radius: 5px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 5px 15px rgba(255,255,255,0.8); }
    .bezel-2000s { background-color: #2a2a2a; padding: 20px 20px 40px 20px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.1); }
    .bezel-modern { background-color: #050505; padding: 10px 10px 20px 10px; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
    
    .power-light { position: absolute; bottom: 15px; right: 30px; width: 8px; height: 8px; background-color: #39ff14; border-radius: 50%; box-shadow: 0 0 8px #39ff14; }
    
    .screen { background-size: cover; background-position: center; width: 100%; height: 100%; position: relative; overflow: hidden; border: 2px solid #000; transition: all 0.3s ease; }
    
    #control-deck { width: 320px; background-color: #111; color: #39ff14; border-left: 2px solid #222; padding: 20px; font-family: monospace; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.8); }
    #control-deck h2 { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; }
    .control-group { margin-bottom: 20px; }
    .control-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
    .control-group select, .control-group input[type="range"] { width: 100%; background: #222; color: #39ff14; border: 1px solid #444; padding: 8px; box-sizing: border-box; }
    
    #desktop-area { position: relative; z-index: 10; height: 100%; padding: 20px; display: flex; flex-direction: column; gap: 15px; align-items: flex-start; }
    
    /* DYNAMIC ICON STYLES */
    .desktop-icon { text-align: center; color: var(--custom-text-color, white); text-shadow: 1px 1px 3px black; cursor: pointer; filter: var(--icon-filter); transition: all 0.2s; }
    .desktop-icon:hover { background: rgba(255,255,255,0.2); border-radius: 5px; }
    .icon-70s { font-family: monospace; font-size: 18px; text-shadow: none; background: var(--custom-bg-tint); border: 1px solid var(--custom-border-color); padding: 5px; }
    .icon-90s { font-size: 12px; width: 70px; }
    .icon-90s span { font-size: 35px; display: block; margin-bottom: 5px; }
    .icon-2000s { font-size: 13px; width: 80px; }
    .icon-2000s span { font-size: 45px; display: block; margin-bottom: 5px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    /* APP WINDOW DYNAMIC PALETTE */
    #app-window { position: absolute; top: 10%; left: 10%; width: 80%; min-height: 400px; display: none; border: 2px solid var(--custom-border-color) !important; background-color: var(--custom-bg-tint) !important; }
    .window-body, .window-body h2, .window-body p { color: var(--custom-text-color) !important; }
    
    #screen-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    .filter-70s { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; background-color: rgba(0, 40, 0, 0.7); box-shadow: inset 0 0 80px rgba(0, 255, 0, 0.4); }
    .filter-80s { background-image: radial-gradient(rgba(255,0,0,0.15) 1px, transparent 2px), radial-gradient(rgba(0,255,0,0.15) 1px, transparent 2px), radial-gradient(rgba(0,0,255,0.15) 1px, transparent 2px); background-size: 4px 4px; background-position: 0 0, 1px 1px, 2px 2px; box-shadow: inset 0 0 60px rgba(0,0,0,0.8); }
    .filter-90s-crt { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 100%); background-size: 3px 100%; box-shadow: inset 0 0 100px rgba(0,0,0,0.9); }
    .filter-lcd { background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 2px 2px; background-color: rgba(255, 255, 255, 0.05); }
    .filter-modern { background: none; }
    
    .glass-glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%); pointer-events: none; z-index: 101; display: none; }
    .curve-0 { border-radius: 0; transform: none; }
    .curve-1 { border-radius: 3% / 4%; transform: scale(0.98); box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
    .curve-1 .glass-glare { display: block; opacity: 0.5; }
    .curve-2 { border-radius: 5% / 7%; transform: scale(0.95); box-shadow: inset 0 0 120px rgba(0,0,0,1); }
    .curve-2 .glass-glare { display: block; opacity: 1; }
  </style>
</head>
<body>

  <div id="monitor-station">
    <div id="physical-monitor" class="monitor-bezel bezel-2000s">
      <div class="power-light"></div>
      <div id="main-screen" class="screen curve-0">
        <div class="glass-glare"></div>
        <div id="screen-filter" class="filter-modern"></div>
        
        <!-- THE DYNAMIC DESKTOP AREA -->
        <div id="desktop-area"></div>

        <!-- THE APP WINDOW -->
        <div id="app-window" class="window glass-window">
          <div class="title-bar">
            <div class="title-bar-text">Application Directory</div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button>
              <button aria-label="Maximize"></button>
              <button aria-label="Close" onclick="closeApp()"></button>
            </div>
          </div>
          <div class="window-body">
            <h2>Welcome to the Directory</h2>
            <p>Explore the evolution of digital culture.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="control-deck">
    <h2>SYSTEM CONFIG</h2>
    
    <div class="control-group">
      <label>Select Era</label>
      <select id="era-select">
        <option value="70s">70s Terminal</option>
        <option value="80s">80s Analog GUI</option>
        <option value="90s">90s Beige Box</option>
        <option value="2000s" selected>2000s Y2K / Aero</option>
        <option value="2010s">2010s Modern</option>
      </select>
    </div>

    <div class="control-group">
      <label>Design (Subflavors)</label>
      <select id="flavor-select"></select>
    </div>
    
    <div class="control-group">
      <label>UI Palette (Borders & Icons)</label>
      <select id="palette-select"></select>
    </div>

    <div class="control-group">
      <label>Text Style (Preset Colors)</label>
      <select id="text-color-select"></select>
    </div>

    <div class="control-group">
      <label>Choose Your Monitor</label>
      <select id="display-select"></select>
    </div>

    <div class="control-group">
      <label>To Bend or Not To Bend</label>
      <input type="range" id="curve-slider" min="0" max="2" value="0">
    </div>
  </div>

  <script>
    // The Central Data Dictionary holding layouts, CSS links, and presets
    const eraData = {
      "70s": { 
        displays: ["CRT Vector Phosphor"], 
        curvesAllowed: true,
        bezelClass: "monitor-bezel bezel-70s",
        wallpaper: "#000000",
        desktopHTML: `<div class="desktop-icon icon-70s" onclick="openApp()">> RUN COMPANION.EXE _</div>`,
        flavors: [
          { name: "Standard Terminal", css: "https://cdn.jsdelivr.net/npm/terminal.css@0.7.2/dist/terminal.min.css" }
        ],
        palettes: [
          { name: "Hacker Contrast", border: "#39ff14", bg: "rgba(0,20,0,0.8)", filter: "none" },
          { name: "Ghost Box", border: "#ffffff", bg: "rgba(20,20,20,0.8)", filter: "grayscale(100%)" }
        ],
        textColors: [
          { name: "Phosphor Green", hex: "#39ff14" },
          { name: "Amber", hex: "#ffbf00" },
          { name: "White", hex: "#ffffff" }
        ]
      },
      "80s": { 
        displays: ["CRT Shadow Mask", "CRT Aperture Grille"], 
        curvesAllowed: true,
        bezelClass: "monitor-bezel bezel-90s",
        wallpaper: "#008080",
        desktopHTML: `<div class="desktop-icon icon-90s" onclick="openApp()"><span>💾</span>Directory</div>`,
        flavors: [
          { name: "Windows 1.0 / 2.0", css: "https://cdn.jsdelivr.net/npm/98.css@0.1.17/build/98.min.css" },
          { name: "Mac System 6", css: "https://cdn.jsdelivr.net/npm/@sakun/system.css@1.0.4/dist/system.css" }
        ],
        palettes: [
          { name: "Default System", border: "transparent", bg: "transparent", filter: "none" },
          { name: "High Contrast", border: "#ffffff", bg: "#000000", filter: "grayscale(100%) contrast(200%)" }
        ],
        textColors: [
          { name: "System Black", hex: "#000000" },
          { name: "System White", hex: "#ffffff" }
        ]
      },
      "90s": { 
        displays: ["CRT Aperture Grille", "Early LCD"], 
        curvesAllowed: true,
        bezelClass: "monitor-bezel bezel-90s",
        wallpaper: "#008080",
        desktopHTML: `<div class="desktop-icon icon-90s" onclick="openApp()"><span>🌐</span>Internet Browser</div><div class="desktop-icon icon-90s" onclick="openApp()"><span>📁</span>My Documents</div>`,
        flavors: [
          { name: "Windows 95/98", css: "https://cdn.jsdelivr.net/npm/98.css@0.1.17/build/98.min.css" },
          { name: "Mac OS 9", css: "https://cdn.jsdelivr.net/npm/@sakun/system.css@1.0.4/dist/system.css" }
        ],
        palettes: [
          { name: "Standard Grey", border: "transparent", bg: "transparent", filter: "none" },
          { name: "Vaporwave Tint", border: "#ff00ff", bg: "rgba(0,255,255,0.2)", filter: "hue-rotate(90deg)" }
        ],
        textColors: [
          { name: "Black", hex: "#000000" },
          { name: "Navy Blue", hex: "#000080" }
        ]
      },
      "2000s": { 
        displays: ["CRT Flat-Screen", "Standard LCD"], 
        curvesAllowed: true,
        bezelClass: "monitor-bezel bezel-2000s",
        wallpaper: "url('PASTE_YOUR_IMAGE_LINK_HERE')", 
        desktopHTML: `<div class="desktop-icon icon-2000s" onclick="openApp()"><span>🌐</span>Aero Browser</div><div class="desktop-icon icon-2000s" onclick="openApp()"><span>🎵</span>Media Player</div>`,
        flavors: [
          { name: "Windows Vista / 7", css: "https://cdn.jsdelivr.net/npm/7.css/dist/7.css" },
          { name: "Windows XP", css: "https://cdn.jsdelivr.net/npm/xp.css@0.2.2/dist/XP.css" }
        ],
        palettes: [
          { name: "Aero Glass (Blue)", border: "transparent", bg: "transparent", filter: "none" },
          { name: "Royale (Green Tint)", border: "#228b22", bg: "rgba(34,139,34,0.1)", filter: "hue-rotate(-50deg)" },
          { name: "Zune (Orange Tint)", border: "#ff8c00", bg: "rgba(255,140,0,0.1)", filter: "hue-rotate(150deg)" }
        ],
        textColors: [
          { name: "Default Black", hex: "#000000" },
          { name: "White (Shadowed)", hex: "#ffffff" }
        ]
      },
      "2010s": { 
        displays: ["Modern Flat Panel (No Filter)"], 
        curvesAllowed: false,
        bezelClass: "monitor-bezel bezel-modern",
        wallpaper: "linear-gradient(135deg, #1f1c2c 0%, #928dab 100%)",
        desktopHTML: `<div class="desktop-icon icon-2000s" onclick="openApp()"><span>🌍</span>Edge Browser</div>`,
        flavors: [
          { name: "Modern Flat", css: "https://cdn.jsdelivr.net/npm/chota@0.9.2/dist/chota.min.css" }
        ],
        palettes: [
          { name: "Light Mode", border: "#dddddd", bg: "#ffffff", filter: "none" },
          { name: "Dark Mode", border: "#333333", bg: "#1a1a1a", filter: "grayscale(20%)" }
        ],
        textColors: [
          { name: "Dark Slate", hex: "#333333" },
          { name: "Off White", hex: "#f4f4f4" }
        ]
      }
    };

    const cssClassMap = {
      "CRT Vector Phosphor": "filter-70s",
      "CRT Shadow Mask": "filter-80s",
      "CRT Aperture Grille": "filter-90s-crt",
      "Early LCD": "filter-lcd",
      "CRT Flat-Screen": "filter-90s-crt", 
      "Standard LCD": "filter-modern",
      "Modern Flat Panel (No Filter)": "filter-modern"
    };

    const eraSelect = document.getElementById("era-select");
    const flavorSelect = document.getElementById("flavor-select");
    const paletteSelect = document.getElementById("palette-select");
    const textColorSelect = document.getElementById("text-color-select");
    const displaySelect = document.getElementById("display-select");
    const curveSlider = document.getElementById("curve-slider");
    
    const screenFilter = document.getElementById("screen-filter");
    const mainScreen = document.getElementById("main-screen");
    const osThemeLink = document.getElementById("os-theme");
    const physicalMonitor = document.getElementById("physical-monitor");
    const desktopArea = document.getElementById("desktop-area");
    const appWindow = document.getElementById("app-window");
    const rootStyles = document.documentElement.style;

    function openApp() { appWindow.style.display = "block"; }
    function closeApp() { appWindow.style.display = "none"; }

    function updateDashboard() {
      const currentEra = eraSelect.value;
      const rules = eraData[currentEra];
      
      physicalMonitor.className = rules.bezelClass;
      mainScreen.style.background = rules.wallpaper;
      mainScreen.style.backgroundSize = "cover";
      mainScreen.style.backgroundPosition = "center";
      
      desktopArea.innerHTML = rules.desktopHTML;
      
      displaySelect.innerHTML = "";
      rules.displays.forEach(display => {
        const option = document.createElement("option");
        option.value = display;
        option.textContent = display;
        displaySelect.appendChild(option);
      });

      flavorSelect.innerHTML = "";
      rules.flavors.forEach((flavor, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.textContent = flavor.name;
        flavorSelect.appendChild(option);
      });

      paletteSelect.innerHTML = "";
      rules.palettes.forEach((pal, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.textContent = pal.name;
        paletteSelect.appendChild(option);
      });

      textColorSelect.innerHTML = "";
      rules.textColors.forEach(color => {
        const option = document.createElement("option");
        option.value = color.hex;
        option.textContent = color.name;
        textColorSelect.appendChild(option);
      });

      if (rules.curvesAllowed) {
        curveSlider.disabled = false;
      } else {
        curveSlider.disabled = true;
        curveSlider.value = 0; 
      }
      
      applyFlavor();
      applyPalette();
      applyTextColor();
      applyFilter();
      applyCurve();
    }

    function applyFlavor() {
      const era = eraData[eraSelect.value];
      const flavor = era.flavors[flavorSelect.value];
      osThemeLink.href = flavor.css;
    }

    function applyPalette() {
      const era = eraData[eraSelect.value];
      const palette = era.palettes[paletteSelect.value];
      rootStyles.setProperty('--custom-border-color', palette.border);
      rootStyles.setProperty('--custom-bg-tint', palette.bg);
      rootStyles.setProperty('--icon-filter', palette.filter);
    }

    function applyTextColor() {
      rootStyles.setProperty('--custom-text-color', textColorSelect.value);
    }

    function applyFilter() {
      const display = displaySelect.value;
      screenFilter.className = cssClassMap[display]; 
      
      if (display.includes("LCD")) {
        curveSlider.disabled = true;
        curveSlider.value = 0;
        applyCurve();
      } else if (eraData[eraSelect.value].curvesAllowed) {
        curveSlider.disabled = false;
      }
    }

    function applyCurve() {
      mainScreen.className = "screen curve-" + curveSlider.value;
    }

    eraSelect.addEventListener("change", updateDashboard);
    flavorSelect.addEventListener("change", applyFlavor);
    paletteSelect.addEventListener("change", applyPalette);
    textColorSelect.addEventListener("change", applyTextColor);
    displaySelect.addEventListener("change", applyFilter);
    curveSlider.addEventListener("input", applyCurve);

    updateDashboard();
  </script>

</body>
</html>
