<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thats Not My Future OS</title>
  <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/7.css/dist/7.css](https://cdn.jsdelivr.net/npm/7.css/dist/7.css)">
  <style>
    body {
      background-color: #121212;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* TOP CONTROL PANEL */
    #control-panel {
      background-color: #000;
      color: #39ff14;
      width: 100%;
      padding: 15px 0;
      text-align: center;
      font-family: monospace;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }
    #control-panel select, #control-panel input {
      margin: 0 15px 0 5px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 3px;
    }
    
    /* THE MONITOR FRAME */
    .monitor-bezel {
      background-color: #2a2a2a;
      padding: 20px 20px 40px 20px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.1);
      width: 90vw;
      max-width: 1200px;
      height: 75vh;
      position: relative;
    }
    
    .power-light {
      position: absolute;
      bottom: 15px;
      right: 30px;
      width: 8px;
      height: 8px;
      background-color: #39ff14;
      border-radius: 50%;
      box-shadow: 0 0 8px #39ff14;
    }
    
    /* THE SCREEN CONTENT */
    .screen {
      background-image: url("PASTE_YOUR_IMAGE_LINK_HERE");
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #000;
    }
    
    /* ========================================= */
    /* NEW: THE ERA DISPLAY FILTERS              */
    /* ========================================= */
    
    #screen-filter {
      position: absolute;
     top: 0;
     left: 0;
     width: 100%;
      height: 100%;
      pointer-events: none; /* Crucial: allows clicking the desktop beneath it */
      z-index: 100; /* Puts the filter on top of everything inside the screen */
    }
    
    /* 70s Vector: Heavy green phosphor wash and thick scanlines */
    .filter-70s {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
     background-color: rgba(0, 40, 0, 0.7);
      box-shadow: inset 0 0 80px rgba(0, 255, 0, 0.4);
    }
    
    /* 80s Shadow Mask: RGB dot matrix pattern */
    .filter-80s {
     background-image: radial-gradient(rgba(255,0,0,0.15) 1px, transparent 2px),
                       radial-gradient(rgba(0,255,0,0.15) 1px, transparent 2px),
                        radial-gradient(rgba(0,0,255,0.15) 1px, transparent 2px);
      background-size: 4px 4px;
      background-position: 0 0, 1px 1px, 2px 2px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
    }
    
    /* 90s Aperture Grille: Fine vertical lines and heavy corner vignette */
    .filter-90s-crt {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 100%);
      background-size: 3px 100%;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
    }
    
    /* Early LCD: Visible pixel grid, slightly washed out blacks */
    .filter-lcd {
     background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 2px 2px;
      background-color: rgba(255, 255, 255, 0.05);
    }
    
    /* Modern: Clear screen, no interference */
    .filter-modern {
      background: none;
    }
  </style>
</head>
<body>

  <!-- TOP CONTROL PANEL -->
  <div id="control-panel">
    <label>ERA:</label>
    <select id="era-select">
      <option value="70s">70s CCTV</option>
      <option value="80s">80s Analog GUI</option>
      <option value="90s">90s Beige Box</option>
      <option value="2000s" selected>2000s Y2K / Aero</option>
      <option value="2010s">2010s Modern</option>
    </select>

    <label>DISPLAY:</label>
    <select id="display-select"></select>

    <label>CURVE INTENSITY:</label>
    <input type="range" id="curve-slider" min="0" max="2" value="0">
  </div>

  <!-- THE MONITOR -->
  <div class="monitor-bezel">
    <div class="power-light"></div>
    
    <div class="screen">
      
      <!-- NEW: The transparent overlay that holds the visual effects -->
      <div id="screen-filter" class="filter-modern"></div>
      
      <!-- Temporary Desktop Text so you can see the filter effects -->
      <h2 style="color: white; text-align: center; margin-top: 15%; position: relative; z-index: 10;">
        Display Filter Test<br>
        <span style="font-size: 0.5em;">Change the dropdowns above to see the hardware change!</span>
      </h2>

    </div>
  </div>

  <!-- THE JAVASCRIPT LOGIC -->
  <script>
    const eraData = {
      "70s": { displays: ["CRT Vector Phosphor"], curvesAllowed: true },
      "80s": { displays: ["CRT Shadow Mask"], curvesAllowed: true },
      "90s": { displays: ["CRT Aperture Grille", "Early LCD"], curvesAllowed: true },
      "2000s": { displays: ["CRT Flat-Screen", "Standard LCD"], curvesAllowed: true },
      "2010s": { displays: ["Modern Flat Panel (No Filter)"], curvesAllowed: false }
    };

    // Dictionary mapping dropdown text to our new CSS classes
    const cssClassMap = {
      "CRT Vector Phosphor": "filter-70s",
      "CRT Shadow Mask": "filter-80s",
      "CRT Aperture Grille": "filter-90s-crt",
      "Early LCD": "filter-lcd",
      "CRT Flat-Screen": "filter-90s-crt", // Reuse aperture logic for late CRTs
      "Standard LCD": "filter-modern",
      "Modern Flat Panel (No Filter)": "filter-modern"
    };

    const eraSelect = document.getElementById("era-select");
    const displaySelect = document.getElementById("display-select");
    const curveSlider = document.getElementById("curve-slider");
    const screenFilter = document.getElementById("screen-filter");

    function updateDashboard() {
      const currentEra = eraSelect.value;
      const rules = eraData[currentEra];
      
      displaySelect.innerHTML = "";
      
      rules.displays.forEach(display => {
        const newOption = document.createElement("option");
        newOption.value = display;
        newOption.textContent = display;
        displaySelect.appendChild(newOption);
      });

      if (rules.curvesAllowed) {
        curveSlider.disabled = false;
      } else {
        curveSlider.disabled = true;
       curveSlider.value = 0;
      }
      
      // Apply the filter immediately when Era changes
      applyFilter();
    }

    // New function to change the CSS class when the Display dropdown changes
    function applyFilter() {
      const selectedDisplay = displaySelect.value;
      const cssClass = cssClassMap[selectedDisplay];
      screenFilter.className = cssClass; // Swaps the CSS class on the overlay
    }

    eraSelect.addEventListener("change", updateDashboard);
    displaySelect.addEventListener("change", applyFilter);

    updateDashboard();
  </script>

</body>
</html>
