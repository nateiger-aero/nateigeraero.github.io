<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thats Not My Future OS</title>
  <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/7.css/dist/7.css](https://cdn.jsdelivr.net/npm/7.css/dist/7.css)">
  <style>
    body {
      background-color: #121212;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* The Control Panel sitting above the monitor */
    #control-panel {
      background-color: #000;
      color: #39ff14;
      width: 100%;
      padding: 15px 0;
      text-align: center;
      font-family: monospace;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }
    #control-panel select, #control-panel input {
      margin: 0 15px 0 5px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 3px;
    }
    
    /* The physical plastic monitor frame */
    .monitor-bezel {
      background-color: #2a2a2a;
      padding: 20px 20px 40px 20px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.1);
      width: 90vw;
      max-width: 1200px;
      height: 75vh;
      position: relative;
    }
    
    .power-light {
      position: absolute;
      bottom: 15px;
      right: 30px;
      width: 8px;
      height: 8px;
      background-color: #39ff14;
      border-radius: 50%;
      box-shadow: 0 0 8px #39ff14;
    }
    
    .screen {
      background-image: url("PASTE_YOUR_IMAGE_LINK_HERE");
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #000;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- TOP CONTROL PANEL -->
  <div id="control-panel">
    <label>ERA:</label>
    <select id="era-select">
      <option value="70s">70s CCTV</option>
      <option value="80s">80s Analog GUI</option>
      <option value="90s">90s Beige Box</option>
      <option value="2000s" selected>2000s Y2K / Aero</option>
      <option value="2010s">2010s Modern</option>
    </select>

    <label>DISPLAY:</label>
    <select id="display-select">
      <!-- JavaScript will auto-fill this based on the era -->
    </select>

    <label>CURVE INTENSITY:</label>
    <input type="range" id="curve-slider" min="0" max="2" value="0">
  </div>

  <!-- THE MONITOR -->
  <div class="monitor-bezel">
    <div class="power-light"></div>
    <div class="screen">
      <!-- Screen content goes here later -->
      <h2 style="color: white; text-align: center; margin-top: 20%;">Display Test</h2>
    </div>
  </div>

  <!-- THE JAVASCRIPT LOGIC -->
  <script>
    // 1. Define the historical rules
    const eraData = {
      "70s": { displays: ["CRT Vector Phosphor"], curvesAllowed: true },
      "80s": { displays: ["CRT Shadow Mask"], curvesAllowed: true },
      "90s": { displays: ["CRT Aperture Grille", "Early LCD"], curvesAllowed: true },
      "2000s": { displays: ["CRT Flat-Screen", "Standard LCD"], curvesAllowed: true },
      "2010s": { displays: ["Modern Flat Panel (No Filter)"], curvesAllowed: false }
    };

    // 2. Grab the HTML elements so we can control them
    const eraSelect = document.getElementById("era-select");
    const displaySelect = document.getElementById("display-select");
    const curveSlider = document.getElementById("curve-slider");

    // 3. Write the function to update the display dropdown
    function updateDashboard() {
      const currentEra = eraSelect.value;
      const rules = eraData[currentEra];
      
      // Clear out the old display options
      displaySelect.innerHTML = "";
      
      // Add the new historically accurate display options
      rules.displays.forEach(display => {
        const newOption = document.createElement("option");
        newOption.value = display;
        newOption.textContent = display;
        displaySelect.appendChild(newOption);
      });

      // Enable or disable the curve slider depending on the era/display
      // (We'll make this even smarter later so LCDs disable the curve!)
      if (rules.curvesAllowed) {
        curveSlider.disabled = false;
      } else {
        curveSlider.disabled = true;
        curveSlider.value = 0; // Force to flat if modern
      }
    }

    // 4. Tell the era dropdown to run the update function whenever it is changed
    eraSelect.addEventListener("change", updateDashboard);

    // 5. Run the function once right away to set up the default 2000s view
    updateDashboard();
  </script>

</body>
</html>
