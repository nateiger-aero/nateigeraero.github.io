<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thats Not My Future OS</title>
  <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/7.css/dist/7.css](https://cdn.jsdelivr.net/npm/7.css/dist/7.css)">
  <style>
    body {
      background-color: #121212;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* TOP CONTROL PANEL */
    #control-panel {
      background-color: #000;
      color: #39ff14;
      width: 100%;
      padding: 15px 0;
      text-align: center;
      font-family: monospace;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }
    #control-panel select, #control-panel input {
      margin: 0 15px 0 5px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 3px;
      vertical-align: middle;
    }
    
    /* THE MONITOR FRAME */
    .monitor-bezel {
      background-color: #2a2a2a;
      padding: 20px 20px 40px 20px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.1);
      width: 90vw;
      max-width: 1200px;
      height: 75vh;
      position: relative;
    }
    
    .power-light {
      position: absolute;
      bottom: 15px;
      right: 30px;
      width: 8px;
      height: 8px;
      background-color: #39ff14;
      border-radius: 50%;
      box-shadow: 0 0 8px #39ff14;
    }
    
    /* THE SCREEN CONTENT */
    .screen {
      background-image: url("PASTE_YOUR_IMAGE_LINK_HERE");
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #000;
      transition: all 0.3s ease; /* Makes the curve slider smooth */
    }
    
    /* ========================================= */
    /* ERA DISPLAY FILTERS                       */
    /* ========================================= */
    #screen-filter {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    .filter-70s {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
     background-color: rgba(0, 40, 0, 0.7);
      box-shadow: inset 0 0 80px rgba(0, 255, 0, 0.4);
    }
    .filter-80s {
     background-image: radial-gradient(rgba(255,0,0,0.15) 1px, transparent 2px),
                       radial-gradient(rgba(0,255,0,0.15) 1px, transparent 2px),
                        radial-gradient(rgba(0,0,255,0.15) 1px, transparent 2px);
      background-size: 4px 4px;
      background-position: 0 0, 1px 1px, 2px 2px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
    }
    .filter-90s-crt {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 100%);
      background-size: 3px 100%;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
    }
    .filter-lcd {
     background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 2px 2px;
      background-color: rgba(255, 255, 255, 0.05);
    }
    .filter-modern { background: none; }
    
    /* ========================================= */
    /* THE CRT CURVE & GLARE LOGIC               */
    /* ========================================= */
    .glass-glare {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
      pointer-events: none;
      z-index: 101;
      display: none; /* Hidden by default */
    }
    
    /* Level 0: Flat */
    .curve-0 {
      border-radius: 0;
      transform: none;
    }
    /* Level 1: Slight Curve */
    .curve-1 {
      border-radius: 3% / 4%;
      transform: scale(0.98);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
    }
    .curve-1 .glass-glare { display: block; opacity: 0.5; }
    
    /* Level 2: Heavy Curve */
    .curve-2 {
      border-radius: 5% / 7%;
      transform: scale(0.95);
      box-shadow: inset 0 0 120px rgba(0,0,0,1);
    }
    .curve-2 .glass-glare { display: block; opacity: 1; }
    
  </style>
</head>
<body>

  <!-- TOP CONTROL PANEL -->
  <div id="control-panel">
    <label>ERA:</label>
    <select id="era-select">
      <option value="70s">70s CCTV</option>
      <option value="80s">80s Analog GUI</option>
      <option value="90s">90s Beige Box</option>
      <option value="2000s" selected>2000s Y2K / Aero</option>
      <option value="2010s">2010s Modern</option>
    </select>

    <label>DISPLAY:</label>
    <select id="display-select"></select>

    <label>CURVE INTENSITY:</label>
    <input type="range" id="curve-slider" min="0" max="2" value="0">
  </div>

  <!-- THE MONITOR -->
  <div class="monitor-bezel">
    <div class="power-light"></div>
    
    <!-- The main screen container gets the curve classes added to it -->
    <div id="main-screen" class="screen curve-0">
      
      <!-- The Glare Overlay -->
      <div class="glass-glare"></div>
      
      <!-- The Display Technology Filter Overlay -->
      <div id="screen-filter" class="filter-modern"></div>
      
      <h2 style="color: white; text-align: center; margin-top: 15%; position: relative; z-index: 10;">
        Drag the Curve Intensity slider!<br>
      </h2>

    </div>
  </div>

  <!-- THE JAVASCRIPT LOGIC -->
  <script>
    const eraData = {
      "70s": { displays: ["CRT Vector Phosphor"], curvesAllowed: true },
      "80s": { displays: ["CRT Shadow Mask"], curvesAllowed: true },
      "90s": { displays: ["CRT Aperture Grille", "Early LCD"], curvesAllowed: true },
      "2000s": { displays: ["CRT Flat-Screen", "Standard LCD"], curvesAllowed: true },
      "2010s": { displays: ["Modern Flat Panel (No Filter)"], curvesAllowed: false }
    };

    const cssClassMap = {
      "CRT Vector Phosphor": "filter-70s",
      "CRT Shadow Mask": "filter-80s",
      "CRT Aperture Grille": "filter-90s-crt",
      "Early LCD": "filter-lcd",
     "CRT Flat-Screen": "filter-90s-crt",
      "Standard LCD": "filter-modern",
      "Modern Flat Panel (No Filter)": "filter-modern"
    };

    const eraSelect = document.getElementById("era-select");
    const displaySelect = document.getElementById("display-select");
    const curveSlider = document.getElementById("curve-slider");
    const screenFilter = document.getElementById("screen-filter");
    const mainScreen = document.getElementById("main-screen");

    function updateDashboard() {
      const currentEra = eraSelect.value;
      const rules = eraData[currentEra];
      
      displaySelect.innerHTML = "";
      
      rules.displays.forEach(display => {
        const newOption = document.createElement("option");
        newOption.value = display;
        newOption.textContent = display;
        displaySelect.appendChild(newOption);
      });

      if (rules.curvesAllowed) {
        curveSlider.disabled = false;
      } else {
        curveSlider.disabled = true;
       curveSlider.value = 0;
      }
      
      applyFilter();
      applyCurve();
    }

    function applyFilter() {
      const selectedDisplay = displaySelect.value;
      const cssClass = cssClassMap[selectedDisplay];
     screenFilter.className = cssClass;
      
      // Auto-disable curve if LCD is selected within an older era
      if (selectedDisplay.includes("LCD")) {
        curveSlider.disabled = true;
        curveSlider.value = 0;
        applyCurve();
      } else if (eraData[eraSelect.value].curvesAllowed) {
        curveSlider.disabled = false;
      }
    }

    // New function to handle the Curve Slider
    function applyCurve() {
      const intensity = curveSlider.value;
      // Overwrites the class to curve-0, curve-1, or curve-2
      mainScreen.className = "screen curve-" + intensity;
    }

    eraSelect.addEventListener("change", updateDashboard);
    displaySelect.addEventListener("change", applyFilter);
    curveSlider.addEventListener("input", applyCurve); // Listens for the slider moving

    updateDashboard();
  </script>

</body>
</html>
