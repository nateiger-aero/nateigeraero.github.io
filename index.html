<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thats Not My Future OS</title>
  
  <link id="os-theme" rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/7.css/dist/7.css](https://cdn.jsdelivr.net/npm/7.css/dist/7.css)">
  
  <style>
    body {
      background-color: #0a0a0a;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: row; /* Puts monitor and sidebar side-by-side */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    /* THE LEFT SIDE (MONITOR AREA) */
    #monitor-station {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .monitor-bezel {
      width: 100%;
      max-width: 1000px;
      height: 80vh;
      position: relative;
      transition: all 0.5s ease;
    }
    
    .bezel-70s { background-color: #1a1a1a; padding: 40px; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
    .bezel-90s { background-color: #e0d8c8; padding: 30px 30px 40px 30px; border-radius: 5px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 5px 15px rgba(255,255,255,0.8); }
    .bezel-2000s { background-color: #2a2a2a; padding: 20px 20px 40px 20px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.1); }
    .bezel-modern { background-color: #050505; padding: 10px 10px 20px 10px; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
    
    .power-light {
      position: absolute;
      bottom: 15px;
      right: 30px;
      width: 8px;
      height: 8px;
      background-color: #39ff14;
      border-radius: 50%;
      box-shadow: 0 0 8px #39ff14;
    }
    
    .screen {
      background-size: cover;
      background-position: center;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #000;
      transition: all 0.3s ease;
    }
    
    /* THE RIGHT SIDE (CONTROL DECK) */
    #control-deck {
      width: 300px;
      background-color: #111;
      color: #39ff14;
      border-left: 2px solid #222;
      padding: 20px;
      font-family: monospace;
      overflow-y: auto;
      box-shadow: -5px 0 15px rgba(0,0,0,0.8);
    }
    
    #control-deck h2 { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; }
    .control-group { margin-bottom: 25px; }
    .control-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
    .control-group select, .control-group input[type="range"] { width: 100%; background: #222; color: #39ff14; border: 1px solid #444; padding: 8px; box-sizing: border-box; }
    .control-group input[type="color"] { width: 100%; height: 40px; background: #222; border: 1px solid #444; cursor: pointer; }
    
    /* DESKTOP ICONS & APP WINDOW */
    #desktop-area {
      position: relative;
      z-index: 10; /* Keeps icons above the background but below filters */
      height: 100%;
      padding: 10px;
    }
    
    .desktop-icon {
      width: 80px;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 3px black;
      cursor: pointer;
      margin-bottom: 20px;
    }
    
    #app-window {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 80%;
      min-height: 400px;
      display: none;
    }
    
    /* FILTERS AND CURVES */
    #screen-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
    .filter-70s { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; background-color: rgba(0, 40, 0, 0.7); box-shadow: inset 0 0 80px rgba(0, 255, 0, 0.4); }
    .filter-80s { background-image: radial-gradient(rgba(255,0,0,0.15) 1px, transparent 2px), radial-gradient(rgba(0,255,0,0.15) 1px, transparent 2px), radial-gradient(rgba(0,0,255,0.15) 1px, transparent 2px); background-size: 4px 4px; background-position: 0 0, 1px 1px, 2px 2px; box-shadow: inset 0 0 60px rgba(0,0,0,0.8); }
    .filter-90s-crt { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 100%); background-size: 3px 100%; box-shadow: inset 0 0 100px rgba(0,0,0,0.9); }
    .filter-lcd { background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 2px 2px; background-color: rgba(255, 255, 255, 0.05); }
    .filter-modern { background: none; }
    
    .glass-glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%); pointer-events: none; z-index: 101; display: none; }
    .curve-0 { border-radius: 0; transform: none; }
    .curve-1 { border-radius: 3% / 4%; transform: scale(0.98); box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
    .curve-1 .glass-glare { display: block; opacity: 0.5; }
    .curve-2 { border-radius: 5% / 7%; transform: scale(0.95); box-shadow: inset 0 0 120px rgba(0,0,0,1); }
    .curve-2 .glass-glare { display: block; opacity: 1; }
  </style>
</head>
<body>

  <!-- THE MONITOR STATION (LEFT) -->
  <div id="monitor-station">
    <div id="physical-monitor" class="monitor-bezel bezel-2000s">
      <div class="power-light"></div>
      
      <div id="main-screen" class="screen curve-0">
        <div class="glass-glare"></div>
        <div id="screen-filter" class="filter-modern"></div>
        
        <!-- THE DESKTOP AREA -->
        <div id="desktop-area">
          <div class="desktop-icon" id="browser-icon">
            <span style="font-size: 40px;">🌐</span>
            <div style="font-size: 12px; margin-top: 5px;">Digital Companion</div>
          </div>

          <div id="app-window" class="window glass-window">
            <div class="title-bar">
              <div class="title-bar-text" id="window-title-text">Aero Browser</div>
              <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close" id="close-btn"></button>
              </div>
            </div>
            <div class="window-body">
              <h2 id="window-content-title" style="color: inherit;">Welcome to the Directory</h2>
              <p id="window-content-text" style="color: inherit;">Explore the evolution of digital culture.</p>
              <button>Open Timeline</button>
            </div>
          </div>
        </div>
        <!-- END DESKTOP AREA -->
      </div>
    </div>
  </div>

  <!-- THE CONTROL DECK (RIGHT) -->
  <div id="control-deck">
    <h2>SYSTEM CONFIG</h2>
    
    <div class="control-group">
      <label>Select Era</label>
      <select id="era-select">
        <option value="70s">70s Terminal</option>
        <option value="80s">80s Analog GUI</option>
        <option value="90s">90s Beige Box</option>
        <option value="2000s" selected>2000s Y2K / Aero</option>
        <option value="2010s">2010s Modern</option>
      </select>
    </div>

    <div class="control-group">
      <label>Design (Subflavors)</label>
      <select id="flavor-select">
        <!-- JS will populate this -->
      </select>
    </div>

    <div class="control-group">
      <label>Text Style (Color)</label>
      <input type="color" id="text-color-picker" value="#39ff14">
    </div>

    <div class="control-group">
      <label>Choose Your Monitor</label>
      <select id="display-select"></select>
    </div>

    <div class="control-group">
      <label>To Bend or Not To Bend</label>
      <input type="range" id="curve-slider" min="0" max="2" value="0">
    </div>
  </div>

  <script>
    const eraData = {
     "70s": {
       displays: ["CRT Vector Phosphor"],
        flavors: ["Standard Green", "Amber Phosphor", "White Terminal"],
        curvesAllowed: true,
        cssLink: "[https://cdn.jsdelivr.net/npm/terminal.css@0.7.2/dist/terminal.min.css](https://cdn.jsdelivr.net/npm/terminal.css@0.7.2/dist/terminal.min.css)",
        bezelClass: "monitor-bezel bezel-70s",
        wallpaper: "#000000" // Pure black for terminal
      },
     "80s": {
       displays: ["CRT Shadow Mask", "CRT Aperture Grille"],
        flavors: ["Windows 1.0", "Mac System 6"],
        curvesAllowed: true,
        cssLink: "[https://cdn.jsdelivr.net/npm/98.css@0.1.17/build/98.min.css](https://cdn.jsdelivr.net/npm/98.css@0.1.17/build/98.min.css)", // Close enough to 80s for now
        bezelClass: "monitor-bezel bezel-90s",
        wallpaper: "#008080" // Classic Solid Teal
      },
     "90s": {
       displays: ["CRT Aperture Grille", "Early LCD"],
        flavors: ["Windows 95", "Windows 98 SE", "Mac OS 9"],
        curvesAllowed: true,
        cssLink: "[https://cdn.jsdelivr.net/npm/98.css@0.1.17/build/98.min.css](https://cdn.jsdelivr.net/npm/98.css@0.1.17/build/98.min.css)",
        bezelClass: "monitor-bezel bezel-90s",
        wallpaper: "#008080" // Classic Solid Teal
      },
     "2000s": {
       displays: ["CRT Flat-Screen", "Standard LCD"],
        flavors: ["Windows Vista / 7", "Mac OS X Tiger", "Ubuntu Linux"],
        curvesAllowed: true,
        cssLink: "[https://cdn.jsdelivr.net/npm/7.css/dist/7.css](https://cdn.jsdelivr.net/npm/7.css/dist/7.css)",
        bezelClass: "monitor-bezel bezel-2000s",
        wallpaper: "url('PASTE_YOUR_IMAGE_LINK_HERE')" // Your Frutiger Aero Image
      },
     "2010s": {
       displays: ["Modern Flat Panel (No Filter)"],
        flavors: ["Windows 11", "macOS Sequoia", "Dark Mode"],
        curvesAllowed: false,
       cssLink: "[https://cdn.jsdelivr.net/npm/chota@0.9.2/dist/chota.min.css](https://cdn.jsdelivr.net/npm/chota@0.9.2/dist/chota.min.css)",
        bezelClass: "monitor-bezel bezel-modern",
        wallpaper: "linear-gradient(135deg, #1f1c2c 0%, #928dab 100%)" // Modern dark gradient
      }
    };

    const cssClassMap = {
      "CRT Vector Phosphor": "filter-70s",
      "CRT Shadow Mask": "filter-80s",
      "CRT Aperture Grille": "filter-90s-crt",
      "Early LCD": "filter-lcd",
     "CRT Flat-Screen": "filter-90s-crt",
      "Standard LCD": "filter-modern",
      "Modern Flat Panel (No Filter)": "filter-modern"
    };

    const eraSelect = document.getElementById("era-select");
    const flavorSelect = document.getElementById("flavor-select");
    const displaySelect = document.getElementById("display-select");
    const curveSlider = document.getElementById("curve-slider");
    const textColorPicker = document.getElementById("text-color-picker");
    
    const screenFilter = document.getElementById("screen-filter");
    const mainScreen = document.getElementById("main-screen");
    const osThemeLink = document.getElementById("os-theme");
    const physicalMonitor = document.getElementById("physical-monitor");
    
    const windowTitle = document.getElementById("window-title-text");
    const windowContentTitle = document.getElementById("window-content-title");
    const windowContentText = document.getElementById("window-content-text");

    function updateDashboard() {
      const currentEra = eraSelect.value;
      const rules = eraData[currentEra];
      
      osThemeLink.href = rules.cssLink;
      physicalMonitor.className = rules.bezelClass;
      
      // 1. UPDATE THE DESKTOP WALLPAPER
      mainScreen.style.background = rules.wallpaper;
      mainScreen.style.backgroundSize = "cover";
      mainScreen.style.backgroundPosition = "center";
      
      // 2. UPDATE DISPLAYS
      displaySelect.innerHTML = "";
      rules.displays.forEach(display => {
        const newOption = document.createElement("option");
        newOption.value = display;
        newOption.textContent = display;
        displaySelect.appendChild(newOption);
      });

      // 3. UPDATE FLAVORS
      flavorSelect.innerHTML = "";
      rules.flavors.forEach(flavor => {
        const newOption = document.createElement("option");
        newOption.value = flavor;
        newOption.textContent = flavor;
        flavorSelect.appendChild(newOption);
      });

      // 4. HANDLE CURVES
      if (rules.curvesAllowed) {
        curveSlider.disabled = false;
      } else {
        curveSlider.disabled = true;
       curveSlider.value = 0;
      }
      
      // Reset custom text coloring when swapping eras
      if (currentEra !== "70s") {
        windowTitle.style.color = "";
        windowContentTitle.style.color = "";
        windowContentText.style.color = "";
      }
      
      applyFilter();
      applyCurve();
    }

    function applyFilter() {
      const selectedDisplay = displaySelect.value;
      const cssClass = cssClassMap[selectedDisplay];
     screenFilter.className = cssClass;
      
      if (selectedDisplay.includes("LCD")) {
        curveSlider.disabled = true;
        curveSlider.value = 0;
        applyCurve();
      } else if (eraData[eraSelect.value].curvesAllowed) {
        curveSlider.disabled = false;
      }
    }

    function applyCurve() {
      const intensity = curveSlider.value;
      mainScreen.className = "screen curve-" + intensity;
    }
    
    function applyTextColor() {
      // Only strictly apply custom colors in the 70s terminal view to avoid breaking later UIs
      if(eraSelect.value === "70s") {
        const color = textColorPicker.value;
        windowTitle.style.color = color;
        windowContentTitle.style.color = color;
        windowContentText.style.color = color;
      }
    }

    eraSelect.addEventListener("change", updateDashboard);
    displaySelect.addEventListener("change", applyFilter);
    curveSlider.addEventListener("input", applyCurve);
    textColorPicker.addEventListener("input", applyTextColor);

    updateDashboard();

    // WINDOW LOGIC
    const browserIcon = document.getElementById("browser-icon");
    const appWindow = document.getElementById("app-window");
    const closeBtn = document.getElementById("close-btn");

    browserIcon.addEventListener("click", () => { appWindow.style.display = "block"; });
    closeBtn.addEventListener("click", () => { appWindow.style.display = "none"; });
  </script>

</body>
</html>
