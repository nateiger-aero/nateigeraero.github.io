<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thats Not My Future OS</title>
  <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/7.css/dist/7.css](https://cdn.jsdelivr.net/npm/7.css/dist/7.css)">
  <style>
    body {
      background-image: url("https://i.redd.it/is-there-a-name-for-this-kind-of-futuristic-aesthetic-v0-xqwyi0yqdz2g1.jpg?width=1200&format=pjpg&auto=webp&s=46b4ba73dc73fd4a94755c478817bdfe738a3bb5");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      margin: 0;
      padding: 20px;
      height: 100vh;
      overflow: hidden; /* Stops the desktop from scrolling */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* Desktop Icon Styling */
    .desktop-icon {
      width: 80px;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 3px black;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
    }
    .desktop-icon span {
      font-size: 40px; /* Using an emoji as a placeholder icon */
      display: block;
    }
    /* Browser Window Styling */
    .glass-window {
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: absolute;
      top: 10%;
      left: 15%;
      width: 70%;
      min-height: 500px;
    }
  </style>
</head>
<body>

  <!-- Desktop Icons Area -->
  <div class="desktop-icon">
    <span>🌐</span>
    <div style="font-size: 12px; margin-top: 5px;">Web Browser</div>
  </div>
  <div class="desktop-icon">
    <span>📁</span>
    <div style="font-size: 12px; margin-top: 5px;">Project Citations</div>
  </div>

  <!-- The Browser App Window -->
  <div class="window glass-window">
    <div class="title-bar">
      <div class="title-bar-text">Aero Browser - The Future We Were Promised</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      
      <!-- The Tab System -->
      <section class="tabs">
        <menu role="tablist" aria-label="Browser Tabs">
          <button role="tab" aria-selected="true" aria-controls="tab-tech">Technology</button>
          <button role="tab" aria-selected="false" aria-controls="tab-culture">Culture</button>
          <button role="tab" aria-selected="false" aria-controls="tab-timeline">Timeline</button>
        </menu>
        
        <!-- Technology Tab Content -->
        <article role="tabpanel" id="tab-tech">
          <h2>Technology & Hardware</h2>
          <p>Welcome to the digital companion. Select a directory to begin.</p>
          <ul class="tree-view">
            <li><a href="technology/smartphones/index.html">>[DIR] Mobile Evolution</a></li>
            <li><a href="technology/social-media/index.html">>[DIR] Social Media Platforms</a></li>
          </ul>
        </article>
      </section>

    </div>
  </div>

</body>
</html>
